name: Kiểm thử (PR)

# Chay tren moi PR va moi lan day nhanh khac main: bien dich toan bo Python,
# kiem cu phap JavaScript cua trang, va chay bo test hoi quy (cac test can du
# lieu thi tu bo qua khi khong co data/fa.npz). Khong cao du lieu, khong dang web.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cài thư viện (đã ghim phiên bản)
        run: pip install -r requirements.txt
      - name: Biên dịch toàn bộ Python
        run: python -m compileall -q . -x '(^|/)(archive|out)/'
      - name: Cú pháp JavaScript của trang
        run: |
          for f in site/*.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "LOI CU PHAP: $f"; exit 1; }; done
      - name: Test hồi quy
        run: python tests/test_regressions.py
      - name: Test TOP110 + khoá lãi S1 (luật, bản JS của trang, thứ tự ưu tiên)
        run: python tests/test_s1_prod.py
      - name: Test lớp quan sát R27A (đường đi sau breakout + gần đạt 7/8 — chỉ hiển thị)
        run: python tests/test_observability.py
      - name: Khoá cổng CFO (nút nghiên cứu không lọt vào PROD)
        run: python tests/test_cfo_lock.py
      - name: R29 missed-winner audit (chỉ đo — khớp engine2.screen)
        run: python tests/test_missed.py
      - name: Lớp real-time giữ cờ mua đỏ / đang cầm của máy chủ
        run: python tests/test_live_flags.py
      - name: Đèn tạm tính = regime2 (phát lại toàn kỳ) + exit_rules chịu cfg null
        run: python tests/test_regime_live.py
      - name: Test luật tối đa 1 lệnh dò treo
        run: python tests/test_max_unconf.py
      - name: Kế hoạch bán phiên tới + chốt 1/3 không vào PROD
        run: python tests/test_ke_hoach_ban.py
      - name: Ngưỡng phiên (tham chiếu, bước giá, KL)
        run: python tests/test_nguong_phien.py
      - name: Mùa báo cáo (chờ đủ 3 phần, mượn số đêm trước, nhật ký BCTC)
        run: python tests/test_mua_bao_cao.py
      - name: Nút vượt cổng dòng tiền (đúng sàn + đúng phiên, file hỏng vẫn chặn)
        run: python tests/test_vuot.py
      - name: Thứ tự ưu tiên điểm + Vol/TB20 (engine = allocator = live)
        run: python tests/test_rank_r38.py
      - name: Lệnh Hard (khuôn lệnh; phần bộ máy tự bỏ qua khi không có data/fa.npz)
        run: python tests/test_hard.py
      - name: Lọc port — chấm mốc, sổ bất đồng, hồ sơ máy + cú pháp trang /port
        run: |
          pip install -q pytest
          pip install -q numpy
          PORT_KHONG_CHUONG=1 python -m pytest -q tests/test_port.py tests/test_port_moi.py tests/test_loc_quy.py tests/test_pool.py tests/test_tu_hoc.py tests/test_danh_sach.py tests/test_vimo.py tests/test_ho_so.py
          node -e "import('./port/worker_port_page.js').then(m=>{if(typeof m.handlePort!=='function')process.exit(1)})"
          node tests/test_trang_port.mjs
