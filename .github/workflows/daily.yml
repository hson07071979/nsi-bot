name: Cập nhật Nguyễn Sơn Invest

on:
  schedule:
    # GitHub chạy theo UTC — giờ Việt Nam = UTC + 7. Đừng sửa thành giờ VN.
    #
    # ĐO THỰC TẾ 07–09/09/2026, đừng đoán lại từ đầu:
    #   cron 12:23 UTC -> chạy 16:43 UTC  (trễ 4h20)
    #   cron 15:23 UTC -> chạy 21:15 UTC  (trễ 5h52)
    #   cron 18:23 UTC -> chạy 18:49 UTC  (trễ 26 phút)
    # Cả ba nhịp ĐỀU nổ, mỗi cái trễ ngẫu nhiên từ nửa tiếng tới gần sáu tiếng.
    #
    # BÀI HỌC: thêm cron KHÔNG kéo giờ chạy sớm lên được. GitHub trễ từng cron
    # một cách độc lập, nên nhiều cron chỉ tăng khả năng "có ít nhất một cái
    # chạy được", đổi lại là chắc chắn dựng trùng 2–3 lần mỗi ngày, mỗi lần
    # 10–14 phút. Bản cũ đặt BA nhịp vì tưởng như vậy sẽ sớm hơn — sai.
    #
    # CÁCH ĐÚNG: giữ HAI nhịp (một tối, một khuya làm lưới an toàn — một nhịp
    # duy nhất mà bị GitHub bỏ là mất trắng cả ngày), rồi làm cho lần chạy thừa
    # trở nên RẺ bằng job `kiem` bên dưới. Đừng thêm cron thứ ba nữa.
    - cron: '23 12 * * 1-5'   # 19h23 giờ VN
    - cron: '23 18 * * 1-5'   # 01h23 giờ VN hôm sau
  workflow_dispatch:        # cho phép bấm chạy tay từ tab Actions

concurrency:
  group: capnhat
  cancel-in-progress: false

jobs:
  # ─── BƯỚC CHẶN TRÙNG PHIÊN ──────────────────────────────────────────────
  # Vì sao cần: GitHub trễ cron tuỳ hứng (xem ghi chú ở phần schedule), nên hai
  # nhịp có thể cùng rơi vào sau giờ đóng cửa của CÙNG một phiên và dựng lại y
  # hệt nhau — mỗi lần 10–14 phút, không thêm một con số nào.
  #
  # Job này hỏi FireAnt phiên giao dịch mới nhất là ngày nào, so với `asof` của
  # thresholds.json đang đăng. Trùng, VÀ bản đang đăng có đủ dữ liệu dòng tiền,
  # thì bỏ qua — lần chạy thừa còn ~30 giây thay vì 14 phút.
  #
  # Mọi trường hợp không chắc đều ngả về CHẠY: hỏi FireAnt hỏng, đọc
  # thresholds.json hỏng, hay bản đang đăng cào sớm nên dòng tiền mỏng. Thà
  # dựng thừa còn hơn bỏ mất một phiên.
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bo_qua: ${{ steps.g.outputs.bo_qua }}
    steps:
      - name: Trang đã dựng cho phiên mới nhất chưa?
        id: g
        env:
          CHU:  ${{ vars.PAGES_OWNER }}
          REPO: ${{ vars.PAGES_REPO }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request

          def get(url, timeout=30):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json',
                  'Referer': 'https://fireant.vn/'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode('utf-8'))

          # 1. Phien moi nhat hoi THANG FireAnt, khong suy tu lich — ngay le ma
          #    doan bang lich la sai, va sai theo huong bo qua nham.
          now = dt.datetime.utcnow() + dt.timedelta(hours=7)     # gio Viet Nam
          to  = now.date().isoformat()
          frm = (now.date() - dt.timedelta(days=12)).isoformat()
          phien = ''
          for sym in ('VCB', 'HPG', 'FPT'):
              try:
                  rows = get('https://www.fireant.vn/api/Data/Companies/HistoricalQuotes'
                             f'?symbol={sym}&startDate={frm}&endDate={to}')
                  if isinstance(rows, list) and rows:
                      phien = max(str(r.get('Date', ''))[:10] for r in rows)
                      break
              except Exception as e:
                  print(f'  hoi {sym} khong duoc: {e}')

          # 2. Trang dang dang phien nao, va ban do co day du khong
          asof, cover = '', None
          try:
              t = get('https://raw.githubusercontent.com/'
                      f'{os.environ["CHU"]}/{os.environ["REPO"]}/main/thresholds.json')
              asof, cover = str(t.get('asof') or ''), t.get('oi_cover')
          except Exception as e:
              print(f'  chua doc duoc thresholds.json: {e}')

          # Ban dang dang thieu oi_cover (dung publish.py cu) => coi nhu chua du,
          # va cu chay. Sau lan dung dau tien co truong do thi tu dong sach.
          du_day = isinstance(cover, (int, float)) and cover >= 0.85
          bo_qua = bool(phien) and asof == phien and du_day

          print(f'phien moi nhat (FireAnt)  : {phien or "KHONG HOI DUOC"}')
          print(f'trang dang dung phien     : {asof or "?"}')
          print(f'do phu dong tien ban dang : {cover}')
          print('=> ' + ('BO QUA — trang da moi roi' if bo_qua else 'CHAY day chuyen'))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('bo_qua=%s\n' % ('true' if bo_qua else 'false'))
          PY

  build:
    needs: kiem
    # Bam chay tay o tab Actions thi LUON chay, ke ca khi trang da moi — de con
    # ep dung lai khi vua sua code.
    if: github.event_name == 'workflow_dispatch' || needs.kiem.outputs.bo_qua != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Khởi tạo dữ liệu tĩnh
        run: python bootstrap.py

      - name: Cào giá và dòng tiền (FireAnt)
        run: python fireant.py

      - name: Nén dữ liệu giá
        run: python fa_prep.py

      - name: Cào báo cáo tài chính (Vietcap IQ)
        run: python fetch_funda.py

      # Kéo ba file sống từ trang public về, để nhúng ảnh chụp vào index.html.
      # Nhờ vậy mở file bằng đường dẫn trên máy vẫn thấy danh mục, không trắng trang.
      # Không tải được cũng không sao — trang tự lùi về đọc thẳng từ máy chủ.
      - name: Lấy sổ lệnh và sổ tay từ trang web
        continue-on-error: true
        env:
          CHU:  ${{ vars.PAGES_OWNER }}
          REPO: ${{ vars.PAGES_REPO }}
        run: |
          mkdir -p data
          for f in portfolio.json manual.json config.json; do
            curl -fsSL -o "data/$f" \
              "https://raw.githubusercontent.com/${CHU}/${REPO}/main/$f" || echo "chưa có $f"
          done
          ls -la data/*.json || true

      - name: Chấm điểm toàn thị trường
        run: python screener.py

      - name: Cập nhật watchlist
        run: python watchlist.py

      - name: Chuông báo cuối phiên
        run: python alerts2.py

      - name: Chạy backtest
        run: python produce2.py

      # LOP KIEM DINH — chay lai backtest vai chuc lan voi tham so khac nhau.
      # Khong lam hong day chuyen neu no truot: trang van dung duoc, chi la tab
      # Kiem dinh se hien canh bao thay vi so lieu. Nhung neu no BAO TRUOT thi
      # phai doc, dung bo qua — do la ly do bo kiem dinh ton tai.
      - name: Kiểm định độ bền hệ thống
        continue-on-error: true
        run: python robustness.py

      # CONG B — "backtest co trade duoc ngoai doi khong". Ba bai: thien lech khop
      # gia dong cua, rui ro khong khop duoc lenh, suc chua von. Day la nhom cau hoi
      # nang hon bo kiem dinh mo hinh, nen phai chay moi toi.
      - name: Kiểm định khớp lệnh thực tế (Cổng B)
        continue-on-error: true
        run: python cong_b.py

      - name: Chuỗi 12 quý cho trang Chi tiết mã
        continue-on-error: true
        run: python funda_series.py

      - name: Dựng trang web
        run: python build_site2.py

      - name: Kiểm tra trước khi đăng
        run: python verify_build.py

      - name: Đóng gói bản đăng
        run: python publish.py

      - name: Lưu bản dựng để tải về
        uses: actions/upload-artifact@v4
        with:
          name: NguyenSonInvest
          path: |
            site/index.html
            data/robust.json
          retention-days: 14

      - name: Đăng lên trang web
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN }}
          CHU:   ${{ vars.PAGES_OWNER }}
          REPO:  ${{ vars.PAGES_REPO }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then
            echo "::error::Thiếu secret PAGES_TOKEN — xem hướng dẫn trong README."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${CHU}/${REPO}.git" public
          cp out/index.html      public/index.html
          cp out/thresholds.json public/thresholds.json
          # hai file thu cong di theo, de bo quet trong phien cung biet ma nao bi loai
          cp out/loai.txt        public/loai.txt
          cp out/ghim.txt        public/ghim.txt
          touch public/.nojekyll
          cd public
          git config user.name  "Bot Nguyễn Sơn Invest"
          git config user.email "bot@users.noreply.github.com"
          git add index.html thresholds.json loai.txt ghim.txt .nojekyll
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi, bỏ qua."
          else
            git commit -m "Cập nhật $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')"
            git push
            echo "Đã đăng lên https://${CHU}.github.io/${REPO}/"
          fi

      - name: Báo khi hỏng
        if: failure()
        run: |
          echo "::error::Dây chuyền hỏng. Vào tab Actions bấm vào lần chạy này để xem bước nào đỏ."
