name: Lọc port (vòng học thứ tư)
# Mã nguồn ở main, DỮ LIỆU port (luận điểm, danh mục, giá chụp, sổ bất đồng) ở nhánh port-data.
# Claude đẩy luận điểm thẳng vào port-data từ chat (không cần PR cho dữ liệu); sửa mã thì qua PR vào main.
# Lượt chạy luôn dùng mã của main + dữ liệu của port-data, rồi ghi trạng thái lại port-data.
# Push bằng GITHUB_TOKEN không kích hoạt workflow khác → không lặp vòng.
on:
  workflow_run:
    workflows: ["Cập nhật Nguyễn Sơn Invest"]
    types: [completed]
  push:
    branches: [port-data]
    paths: ['port/luan_diem/**', 'port/danh_muc.json']
  schedule:
    - cron: '17 11 * * 1-5'      # 18h17 giờ VN, lưới dự phòng nếu daily không gọi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loc-port
  cancel-in-progress: false

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mã nguồn (main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Dữ liệu port (nhánh port-data)
        uses: actions/checkout@v4
        with:
          ref: port-data
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cài thư viện
        run: pip install requests
      - name: Ghép dữ liệu vào mã
        run: |
          mkdir -p port/luan_diem port/state
          cp -r _data/port/luan_diem/. port/luan_diem/ 2>/dev/null || true
          cp -r _data/port/state/. port/state/ 2>/dev/null || true
          cp _data/port/danh_muc.json port/danh_muc.json 2>/dev/null || true
          ls port/luan_diem
      - name: Dựng hồ sơ máy, chấm điểm, đẩy KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python port/build.py
      - name: Ghi trạng thái về port-data
        run: |
          mkdir -p _data/port/state
          cp port/state/*.json _data/port/state/
          cd _data
          git config user.name  "Bot Nguyễn Sơn Invest"
          git config user.email "bot@users.noreply.github.com"
          git add port/state
          if git diff --cached --quiet; then echo "Trạng thái không đổi"; exit 0; fi
          git commit -m "port: chấm điểm $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')"
          git pull --rebase -q origin port-data || true
          git push origin HEAD:port-data
      - name: Lưu gói
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-bundle
          path: port/out/bundle.json
          retention-days: 14
