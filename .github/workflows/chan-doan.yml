name: Chẩn đoán (tạm) — dò hnx.vn + kiểm tra lệnh BÁN 09/10
# KHONG dang trang, KHONG ghi so, KHONG chuong. Xoa sau khi doc ket qua.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/chan-doan.yml']
jobs:
  do_hnx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python research/do_hnx_trang.py
  lenh_ban:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python bootstrap.py
      - run: python fireant.py
      - run: python fa_prep.py
      - run: python orderflow_fill.py
        continue-on-error: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/funda_raw2.json
            data/funda_age.json
            data/ngay_cong_bo.json
          key: bctc-${{ github.run_id }}
          restore-keys: bctc-
      - run: python fetch_funda.py
      - name: Lấy sổ lệnh / sổ tay từ trang (chỉ đọc)
        env:
          CHU:  ${{ vars.PAGES_OWNER }}
          REPO: ${{ vars.PAGES_REPO }}
        run: |
          mkdir -p data
          for f in portfolio.json manual.json config.json watchlist_state.json; do
            curl -fsSL -o "data/$f" "https://raw.githubusercontent.com/${CHU}/${REPO}/main/$f" || rm -f "data/$f"
          done
      - run: python screener.py
      - run: python produce2.py
      - run: python research/in_lenh_ban.py
