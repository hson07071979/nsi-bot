name: Chẩn đoán nguồn dòng tiền HNX (tạm)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/chan-doan.yml', 'research/do_nguon_hnx.py']
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python research/do_nguon_hnx.py
